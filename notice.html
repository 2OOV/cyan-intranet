<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CYAN NOTICE · CYAN GROUP</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --group: #1645C6;
      --pharma: #000047;
      --bio: #0095B6;
      --meditech: #5D8AA8;
      --medical: #76ABDF;

      --text: #202633;
      --subtext: #737b89;
      --line: #e5e9f0;
      --soft-line: #eef1f5;
      --background: #ffffff;
      --soft-background: #f7f9fc;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family:
        Arial,
        "Pretendard",
        "Noto Sans KR",
        "Malgun Gothic",
        sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================
       PAGE
    ========================= */

    .page {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
      padding: 72px 0 48px;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      text-align: center;
      margin-bottom: 64px;
    }

    .brand-logo {
      display: block;
      width: min(310px, 72vw);
      height: auto;
      margin: 0 auto 28px;
    }

    .header-title {
      margin: 0;
      color: #172033;
      font-size: 29px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: 0.12em;
    }

    .header-subtitle {
      margin-top: 9px;
      color: #8a93a2;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.22em;
    }

    .internal-label {
      display: inline-block;
      margin-top: 20px;
      padding-top: 12px;
      border-top: 1px solid #dce2eb;
      color: #9aa2af;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.13em;
    }

    /* =========================
       SECTION HEADER
    ========================= */

    .section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 18px;
    }

    .section-title-wrap {
      min-width: 0;
    }

    .section-kicker {
      margin-bottom: 7px;
      color: var(--group);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.16em;
    }

    .section-title {
      margin: 0;
      font-size: 24px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .section-description {
      margin: 8px 0 0;
      color: var(--subtext);
      font-size: 13px;
      line-height: 1.65;
    }

    .back-link {
      flex: 0 0 auto;
      border: 0;
      background: transparent;
      color: #727b89;
      padding: 4px 0;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      transition: color 0.18s ease;
    }

    .back-link:hover {
      color: var(--group);
    }

    /* =========================
       TOOLBAR
    ========================= */

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 18px 0;
      border-top: 1px solid #ccd4e0;
      border-bottom: 1px solid var(--line);
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .filter-button {
      min-width: 58px;
      height: 34px;
      padding: 0 13px;
      border: 1px solid #dfe4ec;
      border-radius: 5px;
      background: #fff;
      color: #697281;
      font-size: 11px;
      font-weight: 700;
      transition:
        border-color 0.18s ease,
        background 0.18s ease,
        color 0.18s ease;
    }

    .filter-button:hover {
      border-color: #b8c5df;
      color: var(--group);
    }

    .filter-button.active {
      border-color: var(--group);
      background: var(--group);
      color: #fff;
    }

    .search-box {
      display: flex;
      flex: 0 0 300px;
      height: 36px;
      border: 1px solid #dfe4ec;
      border-radius: 5px;
      overflow: hidden;
      background: #fff;
    }

    .search-box:focus-within {
      border-color: #9fb2e3;
    }

    .search-input {
      min-width: 0;
      flex: 1;
      border: 0;
      outline: 0;
      padding: 0 12px;
      background: transparent;
      color: var(--text);
      font-size: 12px;
    }

    .search-input::placeholder {
      color: #a7aeba;
    }

    .search-button {
      width: 42px;
      border: 0;
      border-left: 1px solid #edf0f4;
      background: #fff;
      color: #737d8d;
      font-size: 14px;
    }

    .search-button:hover {
      background: var(--soft-background);
      color: var(--group);
    }

    /* =========================
       NOTICE TABLE
    ========================= */

    .notice-board {
      margin-top: 0;
    }

    .notice-header,
    .notice-row {
      display: grid;
      grid-template-columns: 74px 92px minmax(0, 1fr) 132px 112px 82px;
      align-items: center;
    }

    .notice-header {
      min-height: 45px;
      border-bottom: 1px solid #ccd4e0;
      background: #fafbfd;
      color: #7c8593;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-align: center;
    }

    .notice-row {
      position: relative;
      min-height: 66px;
      border-bottom: 1px solid var(--soft-line);
      transition: background 0.16s ease;
    }

    .notice-row:hover {
      background: #fafbfd;
    }

    .notice-cell {
      min-width: 0;
      padding: 12px 10px;
      font-size: 12px;
      text-align: center;
    }

    .notice-number {
      color: #929aa7;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .notice-category {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 52px;
      height: 25px;
      padding: 0 9px;
      border: 1px solid #dfe5ee;
      border-radius: 999px;
      background: #fff;
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
    }

    .category-all {
      border-color: rgba(22, 69, 198, 0.22);
      background: rgba(22, 69, 198, 0.055);
      color: var(--group);
    }

    .category-group {
      border-color: rgba(22, 69, 198, 0.22);
      background: rgba(22, 69, 198, 0.055);
      color: var(--group);
    }

    .category-pharma {
      border-color: rgba(0, 0, 71, 0.18);
      background: rgba(0, 0, 71, 0.045);
      color: var(--pharma);
    }

    .category-bio {
      border-color: rgba(0, 149, 182, 0.22);
      background: rgba(0, 149, 182, 0.055);
      color: #007d99;
    }

    .category-meditech {
      border-color: rgba(93, 138, 168, 0.24);
      background: rgba(93, 138, 168, 0.06);
      color: #507b98;
    }

    .category-medical {
      border-color: rgba(118, 171, 223, 0.32);
      background: rgba(118, 171, 223, 0.09);
      color: #4e84b8;
    }

    .notice-title-cell {
      padding-left: 18px;
      padding-right: 18px;
      text-align: left;
    }

    .notice-title {
      display: inline-block;
      max-width: 100%;
      border: 0;
      padding: 0;
      background: transparent;
      color: #242b37;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.5;
      text-align: left;
      text-decoration: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      vertical-align: middle;
    }

    .notice-title:hover {
      color: var(--group);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .notice-department,
    .notice-date,
    .notice-views {
      color: #77808e;
      font-size: 11px;
      line-height: 1.4;
    }

    .notice-date,
    .notice-views {
      font-variant-numeric: tabular-nums;
    }

    /* =========================
       EMPTY STATE
    ========================= */

    .empty-state {
      display: none;
      padding: 72px 20px;
      border-bottom: 1px solid var(--line);
      color: #929aa7;
      font-size: 12px;
      text-align: center;
    }

    .empty-state.show {
      display: block;
    }

    /* =========================
       BOARD BOTTOM
    ========================= */

    .board-bottom {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 88px;
      border-bottom: 1px solid #ccd4e0;
    }

    .page-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 31px;
      height: 31px;
      border-radius: 4px;
      background: var(--group);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
    }

    /* =========================
       FOOTER
    ========================= */

    .footer {
      margin-top: 72px;
      text-align: center;
    }

    .footer-text {
      color: #9aa2af;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.15em;
    }

    .division-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      width: 150px;
      height: 3px;
      margin: 14px auto 0;
      overflow: hidden;
      border-radius: 999px;
    }

    .division-bar span:nth-child(1) {
      background: var(--pharma);
    }

    .division-bar span:nth-child(2) {
      background: var(--bio);
    }

    .division-bar span:nth-child(3) {
      background: var(--meditech);
    }

    .division-bar span:nth-child(4) {
      background: var(--medical);
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 860px) {
      .page {
        width: min(100% - 28px, 720px);
        padding-top: 48px;
      }

      .header {
        margin-bottom: 48px;
      }

      .section-head {
        align-items: flex-start;
      }

      .toolbar {
        align-items: stretch;
        flex-direction: column;
      }

      .search-box {
        flex-basis: auto;
        width: 100%;
      }

      .notice-header {
        display: none;
      }

      .notice-board {
        border-top: 1px solid #ccd4e0;
      }

      .notice-row {
        display: block;
        min-height: 0;
        padding: 18px 4px 16px;
      }

      .notice-cell {
        padding: 0;
        text-align: left;
      }

      .notice-number {
        display: none;
      }

      .notice-category-cell {
        margin-bottom: 9px;
      }

      .notice-title-cell {
        padding: 0;
      }

      .notice-title {
        display: block;
        font-size: 14px;
        line-height: 1.55;
        overflow: visible;
        text-overflow: clip;
        white-space: normal;
      }

      .notice-department,
      .notice-date,
      .notice-views {
        display: inline-block;
        margin-top: 10px;
        margin-right: 12px;
      }

      .notice-department::before {
        content: "작성 ";
        color: #a1a8b3;
      }

      .notice-date::before {
        content: "등록 ";
        color: #a1a8b3;
      }

      .notice-views::before {
        content: "조회 ";
        color: #a1a8b3;
      }

      .board-bottom {
        min-height: 72px;
      }
    }

    @media (max-width: 560px) {
      .page {
        width: calc(100% - 24px);
        padding-top: 38px;
      }

      .brand-logo {
        width: min(270px, 76vw);
      }

      .header-title {
        font-size: 24px;
      }

      .section-head {
        display: block;
      }

      .back-link {
        display: inline-block;
        margin-top: 16px;
      }

      .filters {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
      }

      .filter-button {
        width: 100%;
      }
    }
        /* =========================
       NOTICE DETAIL
       ========================= */

    .notice-detail {
      margin-top: 8px;
      border-top: 2px solid #1645C6;
      border-bottom: 1px solid #dfe4ec;
      background: #ffffff;
    }

    .notice-detail-head {
      padding: 34px 36px 30px;
      border-bottom: 1px solid #e5e9f0;
    }

    .notice-detail-head .category-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
    }

    .notice-detail-head h2 {
      margin: 0;
      font-size: 26px;
      line-height: 1.45;
      font-weight: 700;
      letter-spacing: -0.04em;
      color: #111827;
    }

    .notice-detail-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 22px;
      margin-top: 18px;
      font-size: 13px;
      color: #7a8494;
    }

    .notice-detail-meta span + span {
      position: relative;
    }

    .notice-detail-meta span + span::before {
      content: "";
      position: absolute;
      left: -11px;
      top: 50%;
      width: 1px;
      height: 11px;
      background: #d9dee7;
      transform: translateY(-50%);
    }

    .notice-detail-body {
      padding: 44px 36px 52px;
      font-size: 15px;
      line-height: 1.9;
      color: #374151;
      word-break: keep-all;
    }

    .notice-detail-body p {
      margin: 0 0 24px;
    }

    .notice-detail-body h3 {
      margin: 34px 0 10px;
      font-size: 15px;
      font-weight: 700;
      color: #1645C6;
    }

    .notice-detail-body h3:first-child {
      margin-top: 0;
    }

    .notice-detail-body strong {
      font-weight: 700;
      color: #172033;
    }

    .notice-detail-footer {
      display: flex;
      justify-content: flex-end;
      padding: 20px 0;
      border-top: 1px solid #e5e9f0;
    }

    .notice-detail-footer a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 92px;
      height: 38px;
      padding: 0 18px;
      border: 1px solid #d7deea;
      border-radius: 4px;
      background: #ffffff;
      color: #4b5563;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: border-color 0.15s ease, color 0.15s ease;
    }

    .notice-detail-footer a:hover {
      border-color: #1645C6;
      color: #1645C6;
    }
    
    /* =========================
       NOTICE COMMENTS
    ========================= */

    .notice-comments {
      padding: 32px 0 0;
      border-top: 1px solid #e5e9f0;
    }

    .notice-comments-title {
      margin-bottom: 24px;
      font-size: 13px;
      font-weight: 700;
      color: #273142;
    }

    .notice-comments-title span {
      margin-left: 5px;
      color: #1645C6;
      font-variant-numeric: tabular-nums;
    }

    .notice-comment {
      padding: 0 0 24px;
    }

    .notice-comment + .notice-comment {
      padding-top: 24px;
      border-top: 1px solid #edf0f4;
    }

    .notice-comment-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .notice-comment-name {
      font-size: 13px;
      font-weight: 700;
      color: #26303d;
    }

    .notice-comment-info {
      font-size: 11px;
      color: #929aa7;
    }

    .notice-comment-content {
      font-size: 13px;
      line-height: 1.75;
      color: #4b5563;
      word-break: keep-all;
    }

.notice-comment-replies {
  margin-top: 18px;
  margin-left: 28px;
}

.notice-comment-replies > .notice-comment {
  position: relative;
  padding: 0 0 18px 20px;
}

.notice-comment-replies > .notice-comment::before {
  content: "";
  position: absolute;
  left: 0;
  top: 2px;
  width: 2px;
  height: 42px;
  background: #eef1f5;
}

.notice-comment-replies > .notice-comment:last-child {
  padding-bottom: 0;
}
    
    @media (max-width: 720px) {
      .notice-detail-head {
        padding: 26px 20px 24px;
      }

      .notice-detail-head h2 {
        font-size: 21px;
      }

      .notice-detail-meta {
        gap: 6px 16px;
      }

      .notice-detail-meta span + span::before {
        left: -8px;
      }

      .notice-detail-body {
        padding: 32px 20px 40px;
        font-size: 14px;
        line-height: 1.85;
      }

      .notice-detail-footer {
        padding: 16px 0;
      }
    }
  </style>
</head>

          const keyword = searchKeyword.trim().toLowerCase();

          const searchMatch =
            keyword === "" ||
            notice.title.toLowerCase().includes(keyword) ||
            notice.department.toLowerCase().includes(keyword);

          return categoryMatch && searchMatch;
        })
        .sort((a, b) => b.id - a.id);

      noticeList.innerHTML = "";

      if (filtered.length === 0) {
        emptyState.classList.add("show");
        return;

      emptyState.classList.remove("show");
