<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CYAN PEOPLE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: #1f2937;
      font-family:
        Arial,
        "Pretendard",
        "Noto Sans KR",
        "Malgun Gothic",
        sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .page {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      padding: 54px 0 70px;
    }


    /* BACK TO INTRANET */

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      color: #7a8493;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-decoration: none;
      transition:
        color 0.15s ease,
        transform 0.15s ease;
    }

    .back-link:hover {
      color: #1645C6;
      transform: translateX(-3px);
    }


    /* HEADER */

    .page-header {
      padding-bottom: 24px;
      border-bottom: 1px solid #dfe5ed;
    }

    .header-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
    }

    .title-wrap {
      min-width: 0;
    }

    .eyebrow {
      margin-bottom: 8px;
      color: #1645C6;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
    }

    h1 {
      margin: 0;
      color: #111827;
      font-size: 30px;
      line-height: 1.15;
      letter-spacing: -0.03em;
    }

    .header-meta {
      flex-shrink: 0;
      text-align: right;
    }

    .internal-label {
      padding-top: 4px;
      color: #8a94a3;
      font-size: 11px;
      letter-spacing: 0.08em;
    }

    .description {
      margin: 14px 0 0;
      color: #697386;
      font-size: 14px;
      line-height: 1.7;
    }


    /* SEARCH */

    .search-section {
      padding: 28px 0 24px;
      border-bottom: 1px solid #e5e9ef;
    }

    .search-form {
      display: flex;
      align-items: stretch;
      width: 100%;
      min-height: 48px;
      border: 1px solid #cfd7e3;
      background: #ffffff;
    }

    .search-input {
      width: 100%;
      min-width: 0;
      padding: 0 16px;
      border: 0;
      outline: 0;
      background: transparent;
      color: #1f2937;
      font-size: 14px;
    }

    .search-input::placeholder {
      color: #a1a9b5;
    }

    .search-button {
      flex-shrink: 0;
      min-width: 104px;
      padding: 0 18px;
      border: 0;
      border-left: 1px solid #cfd7e3;
      background: #ffffff;
      color: #1645C6;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .search-button:hover {
      background: #f7f9fc;
    }


    /* FILTER */

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 18px;
    }

    .filter-button {
      padding: 8px 13px;
      border: 1px solid #d7dde6;
      background: #ffffff;
      color: #667085;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      transition:
        border-color 0.15s ease,
        color 0.15s ease,
        background 0.15s ease;
    }

    .filter-button:hover {
      border-color: #9fb2e7;
    }

    .filter-button[data-affiliate="ALL"]:hover,
    .filter-button[data-affiliate="GROUP"]:hover {
      color: #1645C6;
    }

    .filter-button[data-affiliate="PHARMA"]:hover {
      color: #000047;
    }

    .filter-button[data-affiliate="BIO"]:hover {
      color: #0095B6;
    }

    .filter-button[data-affiliate="MEDITECH"]:hover {
      color: #5D8AA8;
    }

    .filter-button[data-affiliate="MEDICAL"]:hover {
      color: #76ABDF;
    }

    .filter-button.active {
      border-color: #1645C6;
      background: #1645C6;
      color: #ffffff;
    }

    .filter-button[data-affiliate="ALL"].active,
    .filter-button[data-affiliate="GROUP"].active {
      border-color: #1645C6;
      background: #1645C6;
    }

    .filter-button[data-affiliate="PHARMA"].active {
      border-color: #000047;
      background: #000047;
    }

    .filter-button[data-affiliate="BIO"].active {
      border-color: #0095B6;
      background: #0095B6;
    }

    .filter-button[data-affiliate="MEDITECH"].active {
      border-color: #5D8AA8;
      background: #5D8AA8;
    }

    .filter-button[data-affiliate="MEDICAL"].active {
      border-color: #76ABDF;
      background: #76ABDF;
    }

    .filter-button.active:hover {
      color: #ffffff;
    }


    /* DIRECTORY GUIDE */

    .guide {
      display: flex;
      justify-content: space-between;
      gap: 28px;
      padding: 22px 0;
      border-bottom: 1px solid #dfe5ed;
    }

    .guide-title {
      flex-shrink: 0;
      color: #1645C6;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
    }

    .guide-copy {
      text-align: right;
      color: #7a8493;
      font-size: 12px;
      line-height: 1.65;
    }

    .guide-copy strong {
      display: block;
      color: #4b5563;
      font-weight: 500;
    }


    /* EMPLOYEE DIRECTORY */

    .directory {
      padding-top: 32px;
    }

    .directory-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: 14px;
      border-bottom: 2px solid #172033;
    }

    .directory-title {
      margin: 0;
      color: #172033;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .result-count {
      color: #8a94a3;
      font-size: 11px;
    }


    /* EMPLOYEE GRID */

    .employee-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      column-gap: 34px;
    }

    .employee {
      min-width: 0;
      padding: 21px 0 20px;
      border-bottom: 1px solid #e4e8ee;
    }

    .employee-name {
      display: inline-block;
      margin-bottom: 9px;
      color: #202938;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.35;
    }

    .employee-name-link {
      text-decoration: none;
      transition:
        color 0.15s ease,
        transform 0.15s ease;
    }

    .employee-name-link:hover {
      color: #1645C6;
      transform: translateX(3px);
    }

    .employee-meta {
      overflow-wrap: anywhere;
      color: #667085;
      font-size: 12px;
      line-height: 1.65;
    }

    .employee-extension {
      margin-top: 7px;
      color: #98a1af;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }


    /* SEARCH GROUP */

    .affiliate-group {
      padding-top: 30px;
    }

    .affiliate-group + .affiliate-group {
      margin-top: 8px;
    }

    .affiliate-heading {
      padding-bottom: 10px;
      border-bottom: 1px solid #cfd7e3;
      color: #1645C6;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
    }

    .affiliate-heading[data-affiliate="GROUP"] {
      color: #1645C6;
    }

    .affiliate-heading[data-affiliate="PHARMA"] {
      color: #000047;
    }

    .affiliate-heading[data-affiliate="BIO"] {
      color: #0095B6;
    }

    .affiliate-heading[data-affiliate="MEDITECH"] {
      color: #5D8AA8;
    }

    .affiliate-heading[data-affiliate="MEDICAL"] {
      color: #76ABDF;
    }


    /* EMPTY RESULT */

    .empty-result {
      padding: 54px 0;
      border-bottom: 1px solid #e4e8ee;
      text-align: center;
      color: #8a94a3;
      font-size: 13px;
      line-height: 1.7;
    }


    /* FOOTER */

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-top: 54px;
      padding-top: 18px;
      border-top: 1px solid #dfe5ed;
      color: #a0a7b2;
      font-size: 10px;
      letter-spacing: 0.06em;
    }


    /* RESPONSIVE */

    @media (max-width: 820px) {
      .employee-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        column-gap: 28px;
      }
    }

    @media (max-width: 600px) {
      .page {
        width: min(100% - 28px, 1120px);
        padding-top: 34px;
      }

      .header-top {
        display: block;
      }

      .header-meta {
        margin-top: 14px;
        text-align: left;
      }

      .internal-label {
        padding-top: 0;
      }

      h1 {
        font-size: 26px;
      }

      .search-form {
        min-height: 46px;
      }

      .search-button {
        min-width: 82px;
        padding: 0 12px;
      }

      .guide {
        display: block;
      }

      .guide-copy {
        margin-top: 10px;
        text-align: left;
      }

      .employee-grid {
        grid-template-columns: 1fr;
      }

      .directory-heading {
        align-items: center;
      }

      .footer {
        display: block;
        line-height: 1.8;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <header class="page-header">

      <div class="header-top">

        <div class="title-wrap">
          <div class="eyebrow">
            EMPLOYEE DIRECTORY
          </div>

          <h1>
            CYAN PEOPLE
          </h1>
        </div>

        <div class="header-meta">

          <a
            class="back-link"
            href="intranet.html"
          >
            ← BACK TO INTRANET
          </a>

          <div class="internal-label">
            CYAN GROUP · Internal Use Only
          </div>

        </div>

      </div>

      <p class="description">
        임직원의 소속 및 업무 연락처를 확인할 수 있습니다.
      </p>

    </header>


    <section class="search-section">

      <form
        class="search-form"
        id="peopleSearch"
      >

        <input
          class="search-input"
          id="peopleSearchInput"
          type="search"
          autocomplete="off"
          placeholder="Find a colleague. 이름 또는 소속을 검색하세요."
          aria-label="임직원 검색"
        >

        <button
          class="search-button"
          type="submit"
        >
          SEARCH
        </button>

      </form>


      <div
        class="filter-bar"
        id="filterBar"
      >

        <button
          class="filter-button active"
          type="button"
          data-affiliate="ALL"
        >
          ALL
        </button>

        <button
          class="filter-button"
          type="button"
          data-affiliate="GROUP"
        >
          GROUP
        </button>

        <button
          class="filter-button"
          type="button"
          data-affiliate="PHARMA"
        >
          PHARMA
        </button>

        <button
          class="filter-button"
          type="button"
          data-affiliate="BIO"
        >
          BIO
        </button>

        <button
          class="filter-button"
          type="button"
          data-affiliate="MEDITECH"
        >
          MEDITECH
        </button>

        <button
          class="filter-button"
          type="button"
          data-affiliate="MEDICAL"
        >
          MEDICAL
        </button>

      </div>

    </section>


    <section class="guide">

      <div class="guide-title">
        DIRECTORY GUIDE
      </div>

      <div class="guide-copy">
        <strong>
          Search by name, department or affiliate.
        </strong>
        이름, 부서 또는 계열사로 임직원을 조회하세요.
      </div>

    </section>


    <section class="directory">

      <div class="directory-heading">

        <h2 class="directory-title">
          Employee List
        </h2>

        <div
          class="result-count"
          id="resultCount"
        ></div>

      </div>

      <div id="employeeList"></div>

    </section>


    <footer class="footer">
      <span>CYAN GROUP · EMPLOYEE DIRECTORY</span>
      <span>INTERNAL USE ONLY</span>
    </footer>

  </main>


  <script src="js/employees.js"></script>
  <script src="js/profiles.js"></script>

  <script>
    const employeeList =
      document.getElementById("employeeList");

    const resultCount =
      document.getElementById("resultCount");

    const searchForm =
      document.getElementById("peopleSearch");

    const searchInput =
      document.getElementById("peopleSearchInput");

    const filterBar =
      document.getElementById("filterBar");

    let activeAffiliate = "ALL";


    const affiliateOrder = [
      "GROUP",
      "PHARMA",
      "BIO",
      "MEDITECH",
      "MEDICAL"
    ];


    function normalizeText(value = "") {
      return value
        .toLowerCase()
        .replace(/\s+/g, "");
    }


    function sortEmployees(list) {
      return [...list].sort((a, b) =>
        a.name.localeCompare(
          b.name,
          "ko-KR"
        )
      );
    }


    function getEmployeeSearchText(employee) {
      return normalizeText([
        employee.name,
        employee.affiliate,
        employee.organization,
        employee.department,
        employee.position,
        employee.extension
      ].join(" "));
    }


    function renderEmployee(employee) {
      const name =
        profileLinks[employee.name]
          ? `
            <a
              class="employee-name employee-name-link"
              href="${profileLinks[employee.name]}"
              target="_blank"
              rel="noopener noreferrer"
            >
              ${employee.name}
            </a>
          `
          : `
            <span class="employee-name">
              ${employee.name}
            </span>
          `;

      const meta = [
        employee.organization,
        employee.department,
        employee.position
      ]
        .filter(Boolean)
        .join(" · ");

      return `
        <article class="employee">

          ${name}

          <div class="employee-meta">
            ${meta}
          </div>

          <div class="employee-extension">
            EXT. ${employee.extension}
          </div>

        </article>
      `;
    }


    function renderGrid(list) {
      return `
        <div class="employee-grid">
          ${list
            .map(renderEmployee)
            .join("")}
        </div>
      `;
    }


    function getFilteredEmployees() {
      const query =
        normalizeText(searchInput.value);

      return employees.filter(employee => {
        const matchesAffiliate =
          activeAffiliate === "ALL" ||
          employee.affiliate === activeAffiliate;

        const matchesSearch =
          !query ||
          getEmployeeSearchText(employee)
            .includes(query);

        return (
          matchesAffiliate &&
          matchesSearch
        );
      });
    }


    function renderDirectory() {
      const query =
        normalizeText(searchInput.value);

      const filtered =
        getFilteredEmployees();

      resultCount.textContent =
        `${filtered.length} EMPLOYEES`;

      if (!filtered.length) {
        employeeList.innerHTML = `
          <div class="empty-result">
            검색 결과가 없습니다.
          </div>
        `;

        return;
      }


      /*
        검색어가 없을 때:
        전체 또는 선택한 계열사 직원을
        가나다순으로 표시.
      */

      if (!query) {
        employeeList.innerHTML =
          renderGrid(
            sortEmployees(filtered)
          );

        return;
      }


      /*
        검색 중:
        결과를 계열사별로 묶고
        각 그룹 내부는 가나다순으로 표시.
      */

      const groups =
        affiliateOrder
          .map(affiliate => ({
            affiliate,
            employees:
              sortEmployees(
                filtered.filter(
                  employee =>
                    employee.affiliate === affiliate
                )
              )
          }))
          .filter(group =>
            group.employees.length
          );


      employeeList.innerHTML =
        groups.map(group => `
          <section class="affiliate-group">

            <div
              class="affiliate-heading"
              data-affiliate="${group.affiliate}"
            >
              CYAN ${group.affiliate}
            </div>

            ${renderGrid(group.employees)}

          </section>
        `).join("");
    }


    searchForm
      .addEventListener(
        "submit",
        function(event) {
          event.preventDefault();
          renderDirectory();
        }
      );


    searchInput
      .addEventListener(
        "input",
        renderDirectory
      );


    filterBar
      .addEventListener(
        "click",
        function(event) {
          const button =
            event.target.closest(
              ".filter-button"
            );

          if (!button) return;

          activeAffiliate =
            button.dataset.affiliate;

          document
            .querySelectorAll(
              ".filter-button"
            )
            .forEach(item => {
              item.classList.toggle(
                "active",
                item === button
              );
            });

          renderDirectory();
        }
      );


    const params =
      new URLSearchParams(window.location.search);

    const initialQuery =
      params.get("q");

    if (initialQuery) {
      searchInput.value = initialQuery;
    }

    renderDirectory();
  </script>

</body>
</html>
