<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>About | CYAN GROUP</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: #17191d;
      font-family:
        Arial,
        "Pretendard",
        "Noto Sans KR",
        "Malgun Gothic",
        sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }


    /* ─────────────────────────────
       HEADER
    ───────────────────────────── */

    .site-header {
      position: relative;
      z-index: 100;
      width: 100%;
      background: #ffffff;
      border-bottom: 1px solid #eceef1;
    }

    .header-inner {
      display: flex;
      align-items: center;
      width: min(1440px, calc(100% - 72px));
      height: 72px;
      margin: 0 auto;
    }

    .header-brand {
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .brand-symbol {
      display: block;
      width: 27px;
      height: 27px;
      object-fit: contain;
    }


    /* ─────────────────────────────
       NAVIGATION
    ───────────────────────────── */

    .global-nav {
      display: flex;
      align-items: center;
      gap: 38px;
      margin-left: auto;
    }

    .nav-link {
      position: relative;
      padding: 27px 0 25px;
      color: #42474f;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.07em;
      transition: color 0.15s ease;
    }

    .nav-link::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 2px;
      background: #1645C6;
      transform: scaleX(0);
      transform-origin: center;
      transition: transform 0.18s ease;
    }

    .nav-link:hover,
    .nav-link.active {
      color: #1645C6;
    }

    .nav-link:hover::after,
    .nav-link.active::after {
      transform: scaleX(1);
    }

    .intranet-link {
      margin-left: 42px;
      color: #81868e;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      white-space: nowrap;
      transition: color 0.15s ease;
    }

    .intranet-link:hover {
      color: #1645C6;
    }


    /* ─────────────────────────────
       ABOUT
    ───────────────────────────── */

    .about-hero {
      min-height: calc(100vh - 72px);
      display: flex;
      align-items: center;
    }

    .about-inner {
      width: min(1240px, calc(100% - 120px));
      margin: 0 auto;
      padding: 110px 0 140px;
    }

    .eyebrow {
      margin: 0 0 30px;
      color: #1645C6;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.16em;
    }

    .about-title {
      max-width: 900px;
      margin: 0;
      color: #17191d;
      font-size: clamp(48px, 6vw, 88px);
      font-weight: 600;
      line-height: 1.04;
      letter-spacing: -0.045em;
    }

    .about-visual {
  width: calc(100vw - 40%);
  height: 280px;
  margin-top: 48px;
  margin-left: 32%;
  overflow: hidden;
}

    .about-visual img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
}
    
    .about-copy {
      max-width: 650px;
      margin-top: -82px;
      color: #555b63;
      font-size: 18px;
      font-weight: 400;
      line-height: 1.9;
      word-break: keep-all;
    }

    .about-copy p {
      margin: 0;
    }


    /* ─────────────────────────────
       MOBILE
    ───────────────────────────── */

    @media (max-width: 820px) {
      .header-inner {
        width: calc(100% - 36px);
        height: 62px;
      }

      .global-nav {
        display: none;
      }

      .intranet-link {
        margin-left: auto;
        font-size: 10px;
      }

      .brand-symbol {
        width: 25px;
        height: 25px;
      }

      .about-hero {
        min-height: calc(100vh - 62px);
        align-items: flex-start;
      }

      .about-inner {
        width: calc(100% - 48px);
        padding: 100px 0 110px;
      }

      .eyebrow {
        margin-bottom: 24px;
        font-size: 11px;
      }

      .about-title {
        font-size: clamp(42px, 13vw, 64px);
        line-height: 1.05;
      }

      .about-copy {
        margin-top: 42px;
        font-size: 16px;
        line-height: 1.85;
      }
    }

    @media (max-width: 420px) {
      .header-inner {
        width: calc(100% - 28px);
      }

      .brand-symbol {
        width: 23px;
        height: 23px;
      }

      .intranet-link {
        letter-spacing: 0.05em;
      }

      .about-inner {
        width: calc(100% - 40px);
        padding-top: 80px;
      }
    }
  </style>
</head>

<body>

  <header class="site-header">

    <div class="header-inner">

      <a
        class="header-brand"
        href="../group.html"
        aria-label="CYAN GROUP Home"
      >
        <img
          class="brand-symbol"
          src="https://res.cloudinary.com/qucqug6s/image/upload/v1789559596/%EC%8B%AC%EB%B3%BC_%EB%B3%B8%EC%82%AC.png"
          alt=""
        >
      </a>


      <nav
        class="global-nav"
        aria-label="Main navigation"
      >
        <a class="nav-link active" href="about.html">
          ABOUT
        </a>

        <a class="nav-link" href="business.html">
          BUSINESS
        </a>

        <a class="nav-link" href="innovation.html">
          INNOVATION
        </a>

        <a class="nav-link" href="news.html">
          NEWS
        </a>

        <a class="nav-link" href="careers.html">
          CAREERS
        </a>
      </nav>


      <a
        class="intranet-link"
        href="../index.html"
        target="_blank"
        rel="noopener noreferrer"
      >
        INTRANET ↗
      </a>

    </div>

  </header>


  <main>

    <section class="about-hero">

      <div class="about-inner">

        <p class="eyebrow">
          ABOUT CYAN
        </p>

        <h1 class="about-title">
          Connecting Science,<br>
          Technology and Care.
        </h1>

        <div class="about-visual">
          <img
            src="https://res.cloudinary.com/qucqug6s/image/upload/v1789561622/ChatGPT_Image_2026%EB%85%84_9%EC%9B%94_16%EC%9D%BC_%EC%98%A4%ED%9B%84_09_24_50.png"
            alt=""
  >
</div>

<div class="about-copy">
  <p>
    제약에서 바이오, 의료기술에서 의료현장까지.<br>
    CYAN GROUP은 연구와 기술, 의료를 연결해 더 나은 가능성을 만들어갑니다.
  </p>
</div>

      </div>

    </section>

  </main>

</body>
</html>
