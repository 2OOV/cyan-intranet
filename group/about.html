<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>About | CYAN GROUP</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      overflow: hidden;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #ffffff;
      color: #17191d;
      font-family:
        Arial,
        "Pretendard",
        "Noto Sans KR",
        "Malgun Gothic",
        sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      margin: 0;
      padding: 0;
      border: 0;
      background: none;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }


    /* ─────────────────────────────
       CYAN GROUP ABOUT
       BUSINESS에 넣지 마시오. 🔒
    ───────────────────────────── */


    /* ─────────────────────────────
       HEADER
    ───────────────────────────── */

    .site-header {
      position: relative;
      z-index: 100;
      width: 100%;
      background: #ffffff;
      border-bottom: 1px solid #eceef1;
    }

    .header-inner {
      display: flex;
      align-items: center;
      width: min(1440px, calc(100% - 72px));
      height: 72px;
      margin: 0 auto;
    }

    .header-brand {
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .brand-symbol {
      display: block;
      width: 27px;
      height: 27px;
      object-fit: contain;
    }


    /* ─────────────────────────────
       NAVIGATION
    ───────────────────────────── */

    .global-nav {
      display: flex;
      align-items: center;
      gap: 38px;
      margin-left: auto;
    }

    .nav-link {
      position: relative;
      padding: 27px 0 25px;
      color: #42474f;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.07em;
      transition: color 0.15s ease;
    }

    .nav-link::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 2px;
      background: #1645C6;
      transform: scaleX(0);
      transform-origin: center;
      transition: transform 0.18s ease;
    }

    .nav-link:hover,
    .nav-link.active {
      color: #1645C6;
    }

    .nav-link:hover::after,
    .nav-link.active::after {
      transform: scaleX(1);
    }

    .intranet-link {
      margin-left: 42px;
      color: #81868e;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      white-space: nowrap;
      transition: color 0.15s ease;
    }

    .intranet-link:hover {
      color: #1645C6;
    }


    /* ─────────────────────────────
       ABOUT
       HEADER 72 + ABOUT + FOOTER 50
    ───────────────────────────── */

    .about-hero {
      min-height: calc(100vh - 122px);
      display: flex;
      align-items: flex-start;
    }

    .about-inner {
      position: relative;
      width: min(1240px, calc(100% - 120px));
      margin: 0 auto;
      padding: 50px 0 20px;
    }

    .eyebrow {
      margin: 0 0 30px;
      color: #1645C6;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.16em;
      transform: translateY(-13px);
    }

    .about-title {
      max-width: 900px;
      margin: 0;
      color: #17191d;
      font-size: clamp(48px, 6vw, 88px);
      font-weight: 600;
      line-height: 1.04;
      letter-spacing: -0.045em;
    }

    .about-visual {
      position: absolute;
      left: 35%;
      width: calc(65% + ((100vw - 100%) / 2));
      height: 300px;
      margin-top: 48px;
      overflow: hidden;
    }

    .about-visual img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .about-copy {
      position: relative;
      z-index: 2;
      max-width: 360px;
      margin-top: 110px;
      color: #555b63;
      font-size: 18px;
      font-weight: 400;
      line-height: 1.9;
      word-break: keep-all;
    }

    .about-copy p {
      margin: 0;
    }


    /* ─────────────────────────────
       FOOTER
    ───────────────────────────── */

    .site-footer {
      position: relative;
      z-index: 90;
      width: 100%;
      height: 50px;
      background: #ffffff;
    }

    .site-footer::before {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      left: 0;
      height: 1px;
      background: linear-gradient(
        90deg,
        rgba(22, 69, 198, 0.38) 0%,
        rgba(0, 0, 71, 0.34) 22%,
        rgba(0, 149, 182, 0.34) 46%,
        rgba(93, 138, 168, 0.32) 72%,
        rgba(118, 171, 223, 0.34) 100%
      );
    }

    .footer-inner {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: min(1240px, calc(100% - 120px));
      height: 100%;
      margin: 0 auto;
    }

    .footer-copyright {
      margin: 0;
      color: #969ca4;
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.08em;
    }


    /* ─────────────────────────────
       FAMILY SITE
    ───────────────────────────── */

    .family-site {
      position: relative;
    }

    .family-button {
      display: flex;
      align-items: center;
      gap: 16px;
      color: #555b63;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.09em;
      transition: color 0.16s ease;
    }

    .family-button:hover {
      color: #1645C6;
    }

    .family-icon {
      display: inline-block;
      color: #8d939b;
      font-size: 13px;
      font-weight: 400;
      line-height: 1;
      transition:
        transform 0.18s ease,
        color 0.18s ease;
    }

    .family-site.open .family-icon {
      color: #1645C6;
      transform: rotate(45deg);
    }


    /* ─────────────────────────────
       FAMILY DROP-UP
    ───────────────────────────── */

    .family-menu {
      position: absolute;
      bottom: 34px;
      left: 0;
      width: 230px;
      padding: 8px 0;
      background: rgba(255, 255, 255, 0.98);
      border: 1px solid #e3e6ea;
      opacity: 0;
      visibility: hidden;
      transform: translateY(8px);
      transition:
        opacity 0.18s ease,
        transform 0.18s ease,
        visibility 0.18s ease;
    }

    .family-site.open .family-menu {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .family-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      color: #555b63;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      transition:
        color 0.16s ease,
        background 0.16s ease;
    }

    .family-link.pharma:hover {
      color: #000047;
      background: rgba(0, 0, 71, 0.04);
    }

    .family-link.bio:hover {
      color: #0095B6;
      background: rgba(0, 149, 182, 0.05);
    }

    .family-link.meditech:hover {
      color: #5D8AA8;
      background: rgba(93, 138, 168, 0.06);
    }

    .family-link.medical:hover {
      color: #76ABDF;
      background: rgba(118, 171, 223, 0.07);
    }

    .family-link.hospital:hover {
      color: #1645C6;
      background: rgba(22, 69, 198, 0.04);
    }


    /* ─────────────────────────────
       MOBILE
    ───────────────────────────── */

    @media (max-width: 820px) {
      html,
      body {
        overflow-x: hidden;
        overflow-y: auto;
      }

      .header-inner {
        width: calc(100% - 36px);
        height: 62px;
      }

      .global-nav {
        display: none;
      }

      .intranet-link {
        margin-left: auto;
        font-size: 10px;
      }

      .brand-symbol {
        width: 25px;
        height: 25px;
      }

      .about-hero {
        min-height: auto;
        align-items: flex-start;
      }

      .about-inner {
        width: calc(100% - 48px);
        padding: 80px 0;
      }

      .eyebrow {
        margin-bottom: 24px;
        font-size: 11px;
        transform: none;
      }

      .about-title {
        font-size: clamp(42px, 13vw, 64px);
        line-height: 1.05;
      }

      .about-visual {
        position: relative;
        left: auto;
        width: 100%;
        height: 220px;
        margin-top: 42px;
      }

      .about-copy {
        max-width: 100%;
        margin-top: 36px;
        font-size: 16px;
        line-height: 1.85;
      }

      .site-footer {
        height: 58px;
      }

      .footer-inner {
        width: calc(100% - 48px);
      }

      .family-menu {
        bottom: 38px;
        left: 0;
        width: 210px;
      }
    }


    @media (max-width: 420px) {
      .header-inner {
        width: calc(100% - 28px);
      }

      .brand-symbol {
        width: 23px;
        height: 23px;
      }

      .intranet-link {
        letter-spacing: 0.05em;
      }

      .about-inner {
        width: calc(100% - 40px);
        padding-top: 70px;
      }

      .about-visual {
        height: 190px;
      }

      .footer-inner {
        width: calc(100% - 40px);
      }

      .footer-copyright {
        font-size: 8px;
      }

      .family-button {
        gap: 10px;
        font-size: 9px;
      }
    }
  </style>
</head>


<body>

  <header class="site-header">

    <div class="header-inner">

      <a
        class="header-brand"
        href="../group.html"
        aria-label="CYAN GROUP Home"
      >
        <img
          class="brand-symbol"
          src="https://res.cloudinary.com/qucqug6s/image/upload/v1789559596/%EC%8B%AC%EB%B3%BC_%EB%B3%B8%EC%82%AC.png"
          alt=""
        >
      </a>


      <nav
        class="global-nav"
        aria-label="Main navigation"
      >
        <a class="nav-link active" href="about.html">
          ABOUT
        </a>

        <a class="nav-link" href="business.html">
          BUSINESS
        </a>

        <a class="nav-link" href="innovation.html">
          INNOVATION
        </a>

        <a class="nav-link" href="news.html">
          NEWS
        </a>

        <a class="nav-link" href="careers.html">
          CAREERS
        </a>
      </nav>


      <a
        class="intranet-link"
        href="../index.html"
        target="_blank"
        rel="noopener noreferrer"
      >
        INTRANET ↗
      </a>

    </div>

  </header>


  <main>

    <section class="about-hero">

      <div class="about-inner">

        <p class="eyebrow">
          ABOUT CYAN
        </p>

        <h1 class="about-title">
          Connecting Science,<br>
          Technology and Care.
        </h1>

        <div class="about-visual">
          <img
            src="https://res.cloudinary.com/qucqug6s/image/upload/v1789561622/ChatGPT_Image_2026%EB%85%84_9%EC%9B%94_16%EC%9D%BC_%EC%98%A4%ED%9B%84_09_24_50.png"
            alt=""
          >
        </div>

        <div class="about-copy">
          <p>
            제약에서 바이오, 의료기술에서 의료현장까지.
            CYAN GROUP은 연구와 기술, 의료를 연결해 더 나은 가능성을 만들어갑니다.
          </p>
        </div>

      </div>

    </section>

  </main>


  <footer class="site-footer">

    <div class="footer-inner">

      <div class="family-site">

        <button
          class="family-button"
          type="button"
          aria-expanded="false"
        >
          <span>FAMILY SITE</span>
          <span class="family-icon">＋</span>
        </button>


        <div class="family-menu">

          <a class="family-link pharma" href="#">
            <span>CYAN PHARMA</span>
            <span>↗</span>
          </a>

          <a class="family-link bio" href="#">
            <span>CYAN BIO</span>
            <span>↗</span>
          </a>

          <a class="family-link meditech" href="#">
            <span>CYAN MEDITECH</span>
            <span>↗</span>
          </a>

          <a class="family-link medical" href="#">
            <span>CYAN MEDICAL</span>
            <span>↗</span>
          </a>

          <a class="family-link hospital" href="#">
            <span>성하대학교병원</span>
            <span>↗</span>
          </a>

        </div>

      </div>


      <p class="footer-copyright">
        © 2026 CYAN GROUP
      </p>

    </div>

  </footer>


  <script>
    const familySite =
      document.querySelector(".family-site");

    const familyButton =
      document.querySelector(".family-button");


    familyButton.addEventListener("click", () => {

      const isOpen =
        familySite.classList.toggle("open");

      familyButton.setAttribute(
        "aria-expanded",
        String(isOpen)
      );

    });


    document.addEventListener("click", (event) => {

      if (!familySite.contains(event.target)) {

        familySite.classList.remove("open");

        familyButton.setAttribute(
          "aria-expanded",
          "false"
        );

      }

    });


    document
      .querySelectorAll('.family-link[href="#"]')
      .forEach((link) => {

        link.addEventListener("click", (event) => {
          event.preventDefault();
        });

      });
  </script>

</body>
</html>
