<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CYAN GROUP</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scrollbar-gutter: stable;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: #17191d;
      font-family:
        Arial,
        "Pretendard",
        "Noto Sans KR",
        "Malgun Gothic",
        sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }


    /* ─────────────────────────────
       HEADER
    ───────────────────────────── */

    .site-header {
      position: relative;
      z-index: 100;
      width: 100%;
      background: #ffffff;
      border-bottom: 1px solid #eceef1;
    }

    .header-inner {
      display: flex;
      align-items: center;
      width: min(1440px, calc(100% - 72px));
      height: 72px;
      margin: 0 auto;
    }

    .header-brand {
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .brand-symbol {
      display: block;
      width: 27px;
      height: 27px;
      object-fit: contain;
    }


    /* ─────────────────────────────
       NAVIGATION
    ───────────────────────────── */

    .global-nav {
      display: flex;
      align-items: center;
      gap: 38px;
      margin-left: auto;
    }

    .nav-link {
      position: relative;
      padding: 27px 0 25px;
      color: #42474f;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.07em;
      transition: color 0.15s ease;
    }

    .nav-link::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 2px;
      background: #1645C6;
      transform: scaleX(0);
      transform-origin: center;
      transition: transform 0.18s ease;
    }

    .nav-link:hover {
      color: #1645C6;
    }

    .nav-link:hover::after {
      transform: scaleX(1);
    }

    .intranet-link {
      margin-left: 42px;
      color: #81868e;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      white-space: nowrap;
      transition: color 0.15s ease;
    }

    .intranet-link:hover {
      color: #1645C6;
    }


    /* ─────────────────────────────
       HERO
    ───────────────────────────── */

    .hero {
      width: 100%;
    }

    .hero-image {
      display: block;
      width: 100%;
      height: auto;
    }


    /* ─────────────────────────────
       MOBILE
    ───────────────────────────── */

    @media (max-width: 820px) {
      .header-inner {
        width: calc(100% - 36px);
        height: 62px;
      }

      .global-nav {
        display: none;
      }

      .intranet-link {
        margin-left: auto;
        font-size: 10px;
      }

      .brand-symbol {
        width: 25px;
        height: 25px;
      }
    }

    @media (max-width: 420px) {
      .header-inner {
        width: calc(100% - 28px);
      }

      .brand-symbol {
        width: 23px;
        height: 23px;
      }

      .intranet-link {
        letter-spacing: 0.05em;
      }
    }
  </style>
</head>

<body>

  <header class="site-header">

    <div class="header-inner">

      <a
        class="header-brand"
        href="group.html"
        aria-label="CYAN GROUP Home"
      >
        <img
          class="brand-symbol"
          src="https://res.cloudinary.com/qucqug6s/image/upload/v1789559596/%EC%8B%AC%EB%B3%BC_%EB%B3%B8%EC%82%AC.png"
          alt=""
        >
      </a>


      <nav
        class="global-nav"
        aria-label="Main navigation"
      >
        <a class="nav-link" href="group/about.html">
          ABOUT
        </a>

        <a class="nav-link" href="group/business.html">
          BUSINESS
        </a>

        <a class="nav-link" href="group/innovation.html">
          INNOVATION
        </a>

        <a class="nav-link" href="group/news.html">
          NEWS
        </a>

        <a class="nav-link" href="group/careers.html">
          CAREERS
        </a>
      </nav>


      <a
        class="intranet-link"
        href="index.html"
        target="_blank"
        rel="noopener noreferrer"
      >
        INTRANET ↗
      </a>

    </div>

  </header>


  <main>

    <section class="hero">

      <img
        class="hero-image"
        src="https://res.cloudinary.com/qucqug6s/image/upload/v1789558442/%EA%B7%B8%EB%A3%B9%EC%BB%A4%EB%B2%84.png"
        alt="CYAN GROUP"
      >

    </section>

  </main>

</body>
</html>
